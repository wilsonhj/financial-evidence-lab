packages:
  - "apps/*"
  - "packages/*"

# Security overrides so `node scripts/audit-bulk.mjs` in CI stays green.
# - postcss (M1-EVIDENCE-UI; GHSA-qx2v-qp2m-jg93, GHSA-r28c-9q8g-f849, GHSA-fxqj-rqcc-2cmp):
#   next@16.2.11 pins postcss 8.4.31 exactly, so it needs an override for any advisory.
#   The sourceMappingURL path-traversal chain moved the floor twice: GHSA-r28c-9q8g-f849
#   covers <=8.5.17, and GHSA-fxqj-rqcc-2cmp — an incomplete fix, where the traversal
#   check is skipped when opts.from is unset — covers <=8.5.22; force patched 8.5.x
#   (>=8.5.23). Global rather than next-scoped: vite@8.1.4's declared ^8.5.16 already
#   admits patched versions, but a global override stops any consumer drifting back into
#   the vulnerable window on a future re-resolve. NOTE: fxqj is published on the postcss
#   repo but not yet mirrored into the GitHub Advisory DB, so audit-bulk will not flag
#   8.5.18-8.5.22 today — do not lower this floor on the strength of a green gate.
# - minimatch>brace-expansion (GHSA-mh99-v99m-4gvg / CVE-2026-14257, then
#   GHSA-rgw5-rvv9-x895): unbounded expansion crashes the process (OOM). rgw5 is the
#   *incomplete-fix* follow-up — the mh99 mitigation is bypassable via unbounded
#   intermediate arrays — and it moved both floors: >=4.0.0 <5.0.9 and >=2.0.0 <2.1.4.
#   Two instances resolve here (confirmed with `pnpm why -r`, which is the flag that
#   matters: the non-recursive form shows only the root eslint tree and hides the
#   @fel/contracts one entirely). Each is scoped to its own minimatch major:
#     * minimatch@10.2.5 (eslint, typescript-eslint) declares ^5.0.5 — 5.0.9 lands
#       inside its declared range, so the override is a safe pin-forward.
#     * minimatch@5.1.9 (@redocly/openapi-core <- openapi-typescript <- @fel/contracts)
#       declares ^2.0.1. The 2.x maintenance line now HAS a patched release — 2.1.4,
#       published for rgw5 — where at the time of mh99 it topped out at the vulnerable
#       2.1.2. 2.1.4 is inside minimatch@5.1.9's declared ^2.0.1, so this is an in-range
#       pin-forward, structurally unlike forcing 5.x there.
#   CRITICAL, learned the hard way: do NOT collapse these into one global
#   "brace-expansion" override. brace-expansion moved from a function export to an
#   object export ({expand, ...}) after 2.x, so any 5.x resolution under
#   minimatch@5.1.9 throws "TypeError: expand is not a function" at require time —
#   and it throws at *runtime*, so every gate including `check:generated` passes and
#   the break ships latent. The `@^5` / `@^10` scoping is what keeps the two majors
#   apart; keep it. Verified after this change by requiring minimatch@5.1.9 directly
#   and re-running `check:generated` (byte-equality on the generated client).
#   The scripts/audit-allowlist.json triage for mh99 is retired by this change: with
#   2.1.4 resolved, the 2.x remnant is patched rather than suppressed.
# - js-yaml (GHSA-52cp-r559-cp3m / CVE-2026-59869): @redocly/openapi-core@1.34.17
#   (via openapi-typescript in @fel/contracts) pins js-yaml@4.2.0; force >=4.3.0.
# - fast-uri (GHSA-v2hh-gcrm-f6hx, then GHSA-7p8r-x3mc-p8w7): ajv@8.20.0 pins
#   fast-uri@3.1.3 (host confusion via a backslash authority introducer). v2hh set the
#   floor at 3.1.4; 7p8r is the incomplete-fix follow-up covering >=3.0.0 <3.1.5, so
#   the floor moves to patched 3.x (>=3.1.5). Same pattern as postcss's fxqj and
#   brace-expansion's rgw5 — treat every "backslash authority" fix as provisional.
# - next>sharp (GHSA-f88m-g3jw-g9cj): next@16.2.11 declares sharp ^0.34.5 as an
#   optionalDependency for image optimization (libvips CVEs); scoped to next,
#   force patched 0.35.x (^0.35.0).
overrides:
  "postcss": "^8.5.23"
  "minimatch@^10>brace-expansion": "^5.0.9"
  "minimatch@^5>brace-expansion": "^2.1.4"
  "js-yaml": "^4.3.0"
  "fast-uri": "^3.1.5"
  "next>sharp": "^0.35.0"
