packages:
  - "apps/*"
  - "packages/*"

# Security overrides so `node scripts/audit-bulk.mjs` in CI stays green.
# - postcss (M1-EVIDENCE-UI; GHSA-qx2v-qp2m-jg93, GHSA-r28c-9q8g-f849, GHSA-fxqj-rqcc-2cmp):
#   next@16.2.11 pins postcss 8.4.31 exactly, so it needs an override for any advisory.
#   The sourceMappingURL path-traversal chain moved the floor twice: GHSA-r28c-9q8g-f849
#   covers <=8.5.17, and GHSA-fxqj-rqcc-2cmp — an incomplete fix, where the traversal
#   check is skipped when opts.from is unset — covers <=8.5.22; force patched 8.5.x
#   (>=8.5.23). Global rather than next-scoped: vite@8.1.4's declared ^8.5.16 already
#   admits patched versions, but a global override stops any consumer drifting back into
#   the vulnerable window on a future re-resolve. NOTE: fxqj is published on the postcss
#   repo but not yet mirrored into the GitHub Advisory DB, so audit-bulk will not flag
#   8.5.18-8.5.22 today — do not lower this floor on the strength of a green gate.
# - js-yaml (GHSA-52cp-r559-cp3m / CVE-2026-59869): @redocly/openapi-core@1.34.17
#   (via openapi-typescript in @fel/contracts) pins js-yaml@4.2.0; force >=4.3.0.
# - fast-uri (GHSA-v2hh-gcrm-f6hx): ajv@8.20.0 pins fast-uri@3.1.3 (host
#   confusion via literal backslash authority); force patched 3.x (>=3.1.4).
# - next>sharp (GHSA-f88m-g3jw-g9cj): next@16.2.11 declares sharp ^0.34.5 as an
#   optionalDependency for image optimization (libvips CVEs); scoped to next,
#   force patched 0.35.x (^0.35.0).
overrides:
  "postcss": "^8.5.23"
  "js-yaml": "^4.3.0"
  "fast-uri": "^3.1.4"
  "next>sharp": "^0.35.0"
