          description: Atomic review result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResult"
        default:
          $ref: "#/components/responses/Error"
        "409":
          description:
            "CONFLICT: incompatible merge, terminal action, contradictory resolved alternative
            or IDEMPOTENCY_KEY_REUSED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          description:
            "PRECONDITION_FAILED: selected proposal, approved head or complete conflict membership/ETag
            changed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description:
            "EXTRACTION_TOO_LARGE: bounded request/evidence/group/event ceiling; safe resource
            details, no partial validation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description:
            "VALIDATION_ERROR: malformed closed input/cursor, blocked financial/citation/temporal
            validation or unavailable validation policy."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description:
        Owner/editor/reviewer only. At most 100 selected proposals, exact expected_versions,
        typed action patch and complete conflict membership+ETag. Any stale proposal/group aborts the
        entire transaction with 412. Resolve only explicit groups/winners; unselected states stay unchanged,
        later contradictory acceptance is blocked. Revalidate actual source bytes and current deterministic
        rules; reason cannot override financial/citation/temporal blockers. Merge copies payload_source_id
        and verified evidence union, never aggregates. Same key/different canonical actor/resource/action/body/preconditions
        is 409; successful same-key replay returns exact prior semantic body/status/ETag before stale
        checks. Store immutable review, approved versions, audit, states and receipt in one transaction.
