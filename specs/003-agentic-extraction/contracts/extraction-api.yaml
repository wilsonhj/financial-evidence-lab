          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description:
            "VALIDATION_ERROR: malformed closed input/cursor, blocked financial/citation/temporal
            validation or unavailable validation policy."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description:
        Explicit bounded page. Cursor binds endpoint, tenant, resource, cutoff/corpus and filters;
        reauthorize every page. Deterministic before/after order is not a cross-request MVCC snapshot.
