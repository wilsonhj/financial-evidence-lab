  /v1/extractions/review:
    x-fel-status: planned
    post:
      operationId: reviewExtractions
      summary: Apply an atomic review command
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewCommand"
      responses:
