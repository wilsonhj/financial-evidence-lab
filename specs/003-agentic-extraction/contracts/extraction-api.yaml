          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description:
        Full replacement at frozen source/cutoff; repeat real-byte and current deterministic
        validation. Append immutable child version, audit and exact receipt; never rewrite prior versions
        or invent a proposal-review action. Lock head and compare If-Match (412 on stale). Same-key successful
        replay returns original response even after later versions; changed request reusing key is 409.
