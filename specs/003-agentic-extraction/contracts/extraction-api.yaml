openapi: 3.1.0
info:
  title: FEL M3 Extraction Contract
  version: 0.8.0
  description: ADR-0024 extraction reference; root OpenAPI is authoritative.
paths:
  /v1/workspaces/{workspaceId}/extraction-runs:
    x-fel-status: planned
    post:
      operationId: createExtractionRun
      summary: Create a bounded extraction run
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractionRunCreate"
      responses:
        "202":
          description: Extraction run accepted.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractionRun"
        default:
          $ref: "#/components/responses/Error"
        "409":
          description:
            "CONFLICT: incompatible merge, terminal action, contradictory resolved alternative
            or IDEMPOTENCY_KEY_REUSED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          description:
            "PRECONDITION_FAILED: selected proposal, approved head or complete conflict membership/ETag
            changed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description:
            "EXTRACTION_TOO_LARGE: bounded request/evidence/group/event ceiling; safe resource
            details, no partial validation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description:
            "VALIDATION_ERROR: malformed closed input/cursor, blocked financial/citation/temporal
            validation or unavailable validation policy."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description:
        Owner/editor only. Body at most 1 MiB; at most 200 source IDs and 8 MiB verified evidence.
        Resolve every source/corpus/version and cutoff, pin existing policy/budgets and producer-set conflict_occurrence_policy=run/v1;
        commit queued run, tenant-bound job, event, audit and exact receipt atomically. Manifest never
        contains source text.
    get:
      operationId: listExtractionRuns
      summary: List extraction runs for a workspace
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageOrder"
      responses:
        "200":
          description: Extraction runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractionRunPage"
        default:
          $ref: "#/components/responses/Error"
        "409":
          description:
            "CONFLICT: incompatible merge, terminal action, contradictory resolved alternative
            or IDEMPOTENCY_KEY_REUSED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          description:
            "PRECONDITION_FAILED: selected proposal, approved head or complete conflict membership/ETag
            changed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description:
            "EXTRACTION_TOO_LARGE: bounded request/evidence/group/event ceiling; safe resource
            details, no partial validation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description:
            "VALIDATION_ERROR: malformed closed input/cursor, blocked financial/citation/temporal
            validation or unavailable validation policy."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description:
        Explicit bounded page. Cursor binds endpoint, tenant, resource, cutoff/corpus and filters;
        reauthorize every page. Deterministic before/after order is not a cross-request MVCC snapshot.
  /v1/extraction-runs/{runId}:
    x-fel-status: planned
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: getExtractionRun
      summary: Read one extraction run
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Extraction run.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractionRun"
        default:
          $ref: "#/components/responses/Error"
        "409":
          description:
            "CONFLICT: incompatible merge, terminal action, contradictory resolved alternative
            or IDEMPOTENCY_KEY_REUSED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          description:
            "PRECONDITION_FAILED: selected proposal, approved head or complete conflict membership/ETag
            changed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description:
            "EXTRACTION_TOO_LARGE: bounded request/evidence/group/event ceiling; safe resource
            details, no partial validation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description:
            "VALIDATION_ERROR: malformed closed input/cursor, blocked financial/citation/temporal
            validation or unavailable validation policy."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description:
        ETag is an opaque strong digest of the complete deterministic run representation, including
        status, usage and cancellation. Old frozen source/cutoff remains authoritative.
    delete:
      operationId: cancelExtractionRun
      summary: Cancel an extraction run
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Cancel requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractionRun"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        default:
          $ref: "#/components/responses/Error"
        "409":
          description:
            "CONFLICT: incompatible merge, terminal action, contradictory resolved alternative
            or IDEMPOTENCY_KEY_REUSED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          description:
            "PRECONDITION_FAILED: selected proposal, approved head or complete conflict membership/ETag
            changed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description:
            "EXTRACTION_TOO_LARGE: bounded request/evidence/group/event ceiling; safe resource
            details, no partial validation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description:
            "VALIDATION_ERROR: malformed closed input/cursor, blocked financial/citation/temporal
            validation or unavailable validation policy."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description:
        Owner/editor only. Lock run and compare representation If-Match. Atomically mark run+bound
        job for cooperative queued/running cancellation. Waiting_review appends cancellation event before
        terminal state; preserve proposal history. Fresh terminal cancellation is 409. Identical successful
        idempotency replay returns prior body/status/ETag before stale checks.
  /v1/extraction-runs/{runId}/events:
    x-fel-status: planned
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: streamExtractionRunEvents
      summary: Stream one run's persisted events; Last-Event-ID resumes
      description:
        Metadata-only extraction-event/v1. Authenticate before stream and recheck on bounded
        fetches; release connections between batches. Resume strictly after Last-Event-ID, batch<=200,
        frame<=64KiB, comment heartbeat15–30s. No checkpoints/source/provider output. waiting_review is
        nonterminal; run_succeeded/run_failed/run_cancelled terminate. Invalid or unsafe (>2^53-1) resume
        IDs fail closed, never round.
      security:
        - bearerAuth: []
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991
      responses:
        "200":
          description: text/event-stream of ExtractionEvent JSON payloads.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ExtractionEvent"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
        "409":
          description:
            "CONFLICT: incompatible merge, terminal action, contradictory resolved alternative
            or IDEMPOTENCY_KEY_REUSED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          description:
            "PRECONDITION_FAILED: selected proposal, approved head or complete conflict membership/ETag
            changed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description:
            "EXTRACTION_TOO_LARGE: bounded request/evidence/group/event ceiling; safe resource
            details, no partial validation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description:
            "VALIDATION_ERROR: malformed closed input/cursor, blocked financial/citation/temporal
            validation or unavailable validation policy."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/extraction-runs/{runId}/rerun:
    x-fel-status: planned
    post:
      operationId: rerunExtraction
      summary: Create a child extraction run from a parent
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - reason
              properties:
                reason:
                  type: string
                  minLength: 1
      responses:
        "202":
          description: Child run accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractionRun"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        default:
          $ref: "#/components/responses/Error"
        "409":
          description:
            "CONFLICT: incompatible merge, terminal action, contradictory resolved alternative
            or IDEMPOTENCY_KEY_REUSED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          description:
            "PRECONDITION_FAILED: selected proposal, approved head or complete conflict membership/ETag
            changed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description:
            "EXTRACTION_TOO_LARGE: bounded request/evidence/group/event ceiling; safe resource
            details, no partial validation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description:
            "VALIDATION_ERROR: malformed closed input/cursor, blocked financial/citation/temporal
            validation or unavailable validation policy."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description:
        Owner/editor only. Create linked child, preserving source/corpus and using min(parent
        cutoff,current workspace cutoff); reject ineligible unchanged sources before enqueue. Pin producer-set
        conflict_occurrence_policy=run/v1 in hashed immutable manifest; create independent open occurrences
        even after parent adjudication. Never mutate parent or inherit human decisions.
