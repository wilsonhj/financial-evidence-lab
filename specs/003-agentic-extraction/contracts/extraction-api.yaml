components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description:
        Authenticated tenant context (ADR-0004 read path); org membership is enforced server-side
        on every corpus read.
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description:
        Client-chosen key; retries with the same key return the original result and never duplicate
        work.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    PageCursor:
      name: cursor
      in: query
      description:
        Opaque scope-bound continuation; reauthenticate every request. Not a cross-request
        MVCC snapshot.
      schema:
        type: string
        maxLength: 2048
    PageOrder:
      name: order
      in: query
      schema:
        type: string
        enum:
          - asc
          - desc
        default: asc
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag of the version being updated.
      schema:
        type: string
    ExtractionId:
      name: extractionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ExtractionRunCreate:
      type: object
      additionalProperties: false
      required:
        - entity_id
        - as_of
        - modes
        - source_span_ids
      properties:
        entity_id:
          type: string
          format: uuid
        as_of:
          type: string
          format: date-time
          description:
            Run cutoff. Effective cutoff is min(workspace.as_of, requested as_of); request
            cannot widen workspace scope.
        modes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - kpi
              - guidance
              - revenue_driver
        source_span_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
          maxItems: 200
        claim_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
          maxItems: 200
        corpus_version_id:
          type:
            - string
            - "null"
          format: uuid
        limits:
          $ref: "#/components/schemas/RunLimits"
    RunLimits:
      type: object
      additionalProperties: false
      properties:
        max_calls:
          type: integer
          minimum: 1
          maximum: 10
        max_input_tokens:
          type: integer
          minimum: 1
          maximum: 100000
        max_output_tokens:
          type: integer
          minimum: 1
          maximum: 20000
        max_cost_usd:
          type: string
          pattern: ^(0(\.\d{1,6})?|1(\.\d{1,6})?|2(\.0{1,6})?)$
          description:
            Decimal USD. Request may only lower relative to active policy. Absolute M3 v0.4.0
            schema ceiling equals ADR-0007 default 2.00.
        max_wall_seconds:
          type: integer
          minimum: 1
          maximum: 600
    ExtractionRun:
      type: object
      additionalProperties: false
      required:
        - id
        - workspace_id
        - entity_id
        - status
        - modes
        - as_of
        - ontology_version
        - workflow_version
        - provider
        - model
        - limits
        - usage
        - version
        - created_at
        - cancel_requested_at
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        entity_id:
          type: string
          format: uuid
        parent_run_id:
          type:
            - string
            - "null"
          format: uuid
        status:
          $ref: "#/components/schemas/RunStatus"
        modes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - kpi
              - guidance
              - revenue_driver
        as_of:
          type: string
          format: date-time
        corpus_version_id:
          type: string
          format: uuid
        ontology_version:
          type: string
        workflow_version:
          type: string
        provider:
          type: string
        model:
          type: string
        limits:
          $ref: "#/components/schemas/RunLimits"
        usage:
          type: object
          additionalProperties: false
          required:
            - calls
            - input_tokens
            - output_tokens
            - cost_usd
          properties:
            calls:
              type: integer
            input_tokens:
              type: integer
            output_tokens:
              type: integer
            cost_usd:
              type: string
        version:
          type: integer
          minimum: 1
          description: Stored metadata, not the run ETag; ETag digests the complete deterministic representation.
        error:
          anyOf:
            - $ref: "#/components/schemas/Error"
            - type: "null"
        created_at:
          type: string
          format: date-time
        cancel_requested_at:
          type:
            - string
            - "null"
          format: date-time
          description: Durable request acknowledgement; queued/running cancellation completes cooperatively.
    RunStatus:
      type: string
      enum:
        - queued
        - running
        - waiting_review
        - succeeded
        - failed
        - cancelled
      x-fel-open-enum: false
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - request_id
          properties:
            code:
              type: string
              description: Stable machine-readable code, e.g. TEMPORAL_SCOPE_VIOLATION.
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            request_id:
              type: string
    ExtractionRunPage:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
        - previous_cursor
        - limit
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/ExtractionRun"
        next_cursor:
          type:
            - string
            - "null"
          maxLength: 2048
        previous_cursor:
          type:
            - string
            - "null"
          maxLength: 2048
        limit:
          type: integer
          minimum: 1
          maximum: 200
    ExtractionEvent:
      type: object
      additionalProperties: false
      description: "Persisted extraction run event; SSE `data:` payload. Schema: https://contracts.fel.dev/schemas/extraction-event/v1."
      required:
        - schema_version
        - id
        - run_id
        - type
        - occurred_at
        - payload
      properties:
        schema_version:
          const: extraction-event/v1
        id:
          type: integer
          minimum: 1
        run_id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - run_queued
            - run_started
            - step_started
            - step_completed
            - step_failed
            - budget_updated
            - proposals_persisted
            - review_waiting
            - review_completed
            - run_succeeded
            - run_failed
            - run_cancelled
            - heartbeat
          x-fel-open-enum: false
        occurred_at:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
          description: IDs, counts, states and redacted errors only; no source or prompt text.
    ProposalState:
      type: string
      enum:
        - proposed
        - needs_review
        - accepted
        - rejected
        - superseded
      x-fel-open-enum: false
    ExtractionProposalPage:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
        - previous_cursor
        - limit
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/ExtractionProposal"
        next_cursor:
          type:
            - string
            - "null"
          maxLength: 2048
        previous_cursor:
          type:
            - string
            - "null"
          maxLength: 2048
        limit:
          type: integer
          minimum: 1
          maximum: 200
    ExtractionProposal:
      type: object
      additionalProperties: false
      required:
        - id
        - run_id
        - kind
        - metric_id
        - payload
        - evidence
        - record_confidence
        - field_confidences
        - validations
        - state
        - review_priority
        - version
        - conflict_ids
      properties:
        id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - kpi
            - guidance
            - revenue_driver
        metric_id:
          type: string
        payload:
          $ref: "#/components/schemas/ExtractionPayload"
        evidence:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/EvidenceEdge"
        record_confidence:
          type:
            - string
            - "null"
          pattern: ^(0(\.\d{1,3})?|1(\.0{1,3})?)$
          description: Null means uncalibrated; never convert to zero or invent a score.
        field_confidences:
          type: object
          additionalProperties:
            type: string
        validations:
          type: array
          items:
            type: object
            required:
              - code
              - status
            properties:
              code:
                type: string
              status:
                type: string
                enum:
                  - pass
                  - warning
                  - fail
              detail:
                type: object
                additionalProperties: true
        state:
          $ref: "#/components/schemas/ProposalState"
        review_priority:
          type: string
          enum:
            - normal
            - high
        version:
          type: integer
          minimum: 1
        conflict_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
    ExtractionPayload:
      $ref: ../../../packages/contracts/schemas/extraction-payload.schema.json
    EvidenceEdge:
      type: object
      additionalProperties: false
      required:
        - source_span_id
        - document_version_id
        - role
        - citation_status
      properties:
        source_span_id:
          type: string
          format: uuid
        document_version_id:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - supports
            - definition
            - conflicts
            - derivation_input
        citation_status:
          type: string
          enum:
            - verified
            - partial
            - contradictory
            - invalid
    ReviewCommand:
      $ref: ../../../packages/contracts/schemas/extraction-review-command.schema.json
    ReviewResult:
      $ref: ../../../packages/contracts/schemas/extraction-review-result.schema.json
    ApprovedExtraction:
      type: object
      additionalProperties: false
      required:
        - record_id
        - version_id
        - version
        - kind
        - metric_id
        - payload
        - evidence
        - evidence_manifest_hash
        - ontology_version
        - approved_by
        - created_at
        - approval_reason
        - normalizer_version
        - validator_version
        - validation_context
      properties:
        record_id:
          type: string
          format: uuid
        version_id:
          type: string
          format: uuid
        parent_version_id:
          type:
            - string
            - "null"
          format: uuid
        version:
          type: integer
          minimum: 1
        kind:
          type: string
          enum:
            - kpi
            - guidance
            - revenue_driver
        metric_id:
          type: string
        payload:
          $ref: "#/components/schemas/ExtractionPayload"
        evidence:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/EvidenceEdge"
        evidence_manifest_hash:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        ontology_version:
          type: string
        approved_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        approval_reason:
          type: string
        normalizer_version:
          type: string
        validator_version:
          type: string
        validation_context:
          anyOf:
            - $ref: "#/components/schemas/ExtractionValidationContext"
            - type: "null"
          description: Historical null is unknown provenance; new approved versions require complete context.
    ExtractionValidationContext:
      $ref: ../../../packages/contracts/schemas/extraction-validation-context.schema.json
    ApprovedExtractionPage:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
        - previous_cursor
        - limit
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/ApprovedExtraction"
        next_cursor:
          type:
            - string
            - "null"
          maxLength: 2048
        previous_cursor:
          type:
            - string
            - "null"
          maxLength: 2048
        limit:
          type: integer
          minimum: 1
          maximum: 200
    CorrectionCommand:
      type: object
      additionalProperties: false
      required:
        - reason
        - payload
        - evidence
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        payload:
          $ref: "#/components/schemas/ExtractionPayload"
        evidence:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/EvidenceEdge"
          maxItems: 200
      description:
        Full replacement at frozen source/cutoff; repeat real-byte and current deterministic
        validation. Append immutable child version, audit and exact receipt; never rewrite prior versions
        or invent a proposal-review action.
    ExtractionStepPage:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
        - previous_cursor
        - limit
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/ExtractionStepSummary"
        next_cursor:
          type:
            - string
            - "null"
          maxLength: 2048
        previous_cursor:
          type:
            - string
            - "null"
          maxLength: 2048
        limit:
          type: integer
          minimum: 1
          maximum: 200
    ExtractionStepSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - step_name
        - attempt
        - status
        - input_hash
        - output_hash
        - started_at
        - finished_at
      properties:
        id:
          type: string
          format: uuid
        step_name:
          type: string
        attempt:
          type: integer
          minimum: 1
        status:
          enum:
            - pending
            - running
            - succeeded
            - failed
            - skipped
            - cancelled
        input_hash:
          type: string
        output_hash:
          type:
            - string
            - "null"
        started_at:
          type:
            - string
            - "null"
          format: date-time
        finished_at:
          type:
            - string
            - "null"
          format: date-time
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        cost_usd:
          type: string
        error:
          anyOf:
            - $ref: "#/components/schemas/Error"
            - type: "null"
    ExtractionEventPage:
      $ref: ../../../packages/contracts/schemas/extraction-event-page.schema.json
    ExtractionConflictPage:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
        - previous_cursor
        - limit
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/ExtractionConflict"
        next_cursor:
          type:
            - string
            - "null"
          maxLength: 2048
        previous_cursor:
          type:
            - string
            - "null"
          maxLength: 2048
        limit:
          type: integer
          minimum: 1
          maximum: 200
    ExtractionConflict:
      $ref: ../../../packages/contracts/schemas/extraction-conflict.schema.json
  headers:
    ETag:
      description: Version tag for optimistic concurrency.
      schema:
        type: string
  responses:
    Error:
      description: Error envelope (all non-2xx responses use this shape).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
