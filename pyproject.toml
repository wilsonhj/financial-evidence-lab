[tool.ruff]
line-length = 100
target-version = "py311"
src = [
    "apps/api",
    "scripts/db",
    "workers/src",
    "evals",
    "packages/providers",
    "packages/retrieval",
    "packages/retrieval-evals",
    "packages/ontology",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
# per-module overrides preferred; global escape hatch removed
mypy_path = "apps/api:workers/src:evals:packages/providers:packages/retrieval:packages/retrieval-evals:packages/ontology"

[tool.pytest.ini_options]
pythonpath = [
    "apps/api",
    "scripts/db",
    "workers/src",
    "evals",
    "packages/providers",
    "packages/retrieval",
    "packages/retrieval-evals",
    "packages/ontology",
]
testpaths = [
    "apps/api/tests",
    "scripts/db/tests",
    "workers/tests",
    "evals/tests",
    "packages/providers/tests",
    "packages/retrieval/tests",
    "packages/retrieval-evals/tests",
    "packages/ontology/tests",
]
addopts = "-q --import-mode=importlib"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
