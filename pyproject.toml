[tool.ruff]
line-length = 100
target-version = "py311"
src = [
    "apps/api",
    "scripts/db",
    "workers/src",
    "evals",
    "packages/providers",
    "packages/retrieval",
    "packages/retrieval-evals",
    "packages/ontology",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
# per-module overrides preferred; global escape hatch removed
mypy_path = "apps/api:workers/src:evals:packages/providers:packages/retrieval:packages/retrieval-evals:packages/ontology"

[tool.pytest.ini_options]
pythonpath = [
    "apps/api",
    "scripts/db",
    "workers/src",
    "evals",
    "packages/providers",
    "packages/retrieval",
    "packages/retrieval-evals",
    "packages/ontology",
]
testpaths = [
    "apps/api/tests",
    "scripts/db/tests",
    "workers/tests",
    "evals/tests",
    "packages/providers/tests",
    "packages/retrieval/tests",
    "packages/retrieval-evals/tests",
    "packages/ontology/tests",
]
addopts = "-q --import-mode=importlib"

[tool.coverage.run]
branch = false
# Source packages, matching the mypy target list in ci.yml. Coverage is opt-in
# (`pytest --cov`) rather than an addopts default so local runs stay fast; CI's
# python job passes the flags.
source = [
    "apps/api/app",
    "workers/src/fel_workers",
    "evals",
    "packages/providers/fel_providers",
    "packages/retrieval/fel_retrieval",
    "packages/retrieval-evals/fel_retrieval_evals",
    "packages/ontology/fel_ontology",
]
omit = ["*/tests/*"]

[tool.coverage.report]
# Floor = the measured baseline minus one point. Raise it when coverage rises;
# never lower it without saying why in the PR.
fail_under = 91
show_missing = false
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
