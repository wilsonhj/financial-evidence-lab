[tool.ruff]
line-length = 100
target-version = "py311"
src = [
    "apps/api",
    "scripts/db",
    "workers/src",
    "evals",
    "packages/providers",
    "packages/retrieval",
    "packages/retrieval-evals",
    "packages/ontology",
    "packages/calculation-engine",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
# per-module overrides preferred; global escape hatch removed
mypy_path = "apps/api:workers/src:evals:packages/providers:packages/retrieval:packages/retrieval-evals:packages/ontology:packages/calculation-engine"

[tool.pytest.ini_options]
pythonpath = [
    "apps/api",
    "scripts/db",
    "workers/src",
    "evals",
    "packages/providers",
    "packages/retrieval",
    "packages/retrieval-evals",
    "packages/ontology",
    "packages/calculation-engine",
]
testpaths = [
    "apps/api/tests",
    "scripts/db/tests",
    "workers/tests",
    "evals/tests",
    "packages/providers/tests",
    "packages/retrieval/tests",
    "packages/retrieval-evals/tests",
    "packages/ontology/tests",
    "packages/calculation-engine/tests",
]
addopts = "-q --import-mode=importlib"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.coverage.run]
branch = true
source = [
    "apps/api/app",
    "workers/src/fel_workers",
    "evals",
    "packages/providers/fel_providers",
    "packages/retrieval/fel_retrieval",
    "packages/retrieval-evals/fel_retrieval_evals",
    "packages/ontology/fel_ontology",
    "packages/calculation-engine/fel_calculation_engine",
    "scripts/db",
    "scripts/runtime",
]
omit = ["*/tests/*"]

[tool.coverage.report]
precision = 2
show_missing = true
