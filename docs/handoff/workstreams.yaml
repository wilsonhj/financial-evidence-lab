# Standing exceptions: mechanical edits forced by an in-scope change may ride
# with the owning package's PR under the four conditions of the named ADR.
# ADR-0003 covers the JS workspace files. ADR-0008 (once accepted) covers the
# scaffold-registration edits a NEW first-party package needs to become visible
# to the shared gates (pyproject.toml dir-lists, Makefile dir-lists, the ci.yml
# python-job dir-lists) — dir-list registration ONLY. Dependency additions
# (requirements-dev.txt AND the pyproject.toml dependency tables
# [project] dependencies / [project.optional-dependencies]) and everything
# else above have NO standing exception
# and always require explicit per-dispatch integration-lead authorization or
# the full contract-change process. Automated dispatch/review must treat every
# path above as shared; each exception is judged per-hunk at review time.
shared_path_exceptions:
  - adr: docs/decisions/ADR-0003-root-config-edits.md
    applies_to:
      [package.json, pnpm-lock.yaml, pnpm-workspace.yaml, tsconfig.json, tsconfig.base.json]
    rule: mechanical-consequence-of-in-scope-change-only
  - adr: docs/decisions/ADR-0008-python-package-scaffold-edits.md
    # infra/railway/worker.json added by ADR-0008 Amendment 1 (2026-07-29):
    # appending a first-party ./packages/* path to build.buildCommand's pip
    # install list ONLY, and only when the worker imports it. The deploy block
    # (startCommand, restartPolicy, health checks, env wiring), api.json, and
    # everything else under infra/** stay outside the exception (#84 owns them).
    applies_to: [pyproject.toml, Makefile, .github/workflows/ci.yml, infra/railway/worker.json]
    rule: new-first-party-package-scaffold-registration-only
