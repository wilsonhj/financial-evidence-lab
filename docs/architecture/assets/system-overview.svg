<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 660" width="1160" height="660" role="img" aria-labelledby="title-sys-overview desc-sys-overview">
  <title id="title-sys-overview">Financial Evidence Lab &#8212; System Topology and Trust Boundaries</title>
  <desc id="desc-sys-overview">Layered architecture diagram showing Analyst Browser, Next.js 16 Web Workspace, FastAPI Service with RLS tenant boundary, Durable Python Workers, PostgreSQL 17 + pgvector, Content-Addressed Object Storage, and External Providers.</desc>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d29922" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#bc8cff" />
    </marker>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220" />
      <stop offset="100%" stop-color="#111a2e" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <g id="layer-background">
    <rect x="0" y="0" width="1160" height="660" rx="16" fill="url(#bg-grad)" stroke="#26354d" stroke-width="2" />
    <text x="32" y="42" fill="#f0f6fc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">Financial Evidence Lab &#8212; System Architecture &amp; Trust Boundaries</text>
    <text x="32" y="64" fill="#8b949e" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Point-in-time cutoff enforcement &#8226; Immutable content-addressed evidence &#8226; Tenant RLS isolation &#8226; Fail-closed provider boundaries</text>
  </g>

  <!-- Zone 1: Client & Web Layer -->
  <g id="zone-web-interaction">
    <rect x="28" y="88" width="280" height="536" rx="12" fill="#131d31" stroke="#2f4b7c" stroke-width="1.5" stroke-dasharray="6 4" />
    <text x="44" y="114" fill="#79c0ff" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="0.08em">1. INTERACTION LAYER (CLIENT &amp; SSR)</text>

    <!-- Analyst Node -->
    <g id="node-analyst">
      <rect x="48" y="132" width="240" height="68" rx="8" fill="#1b2842" stroke="#58a6ff" stroke-width="1.5" />
      <text x="64" y="158" fill="#f0f6fc" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="700">Analyst / Reviewer Browser</text>
      <text x="64" y="178" fill="#9cacbf" font-family="Inter, -apple-system, sans-serif" font-size="11.5">Zero server tokens in client bundle</text>
      <text x="64" y="192" fill="#79c0ff" font-family="'JetBrains Mono', monospace" font-size="10.5">HTTPS + SSE Event Stream</text>
    </g>

    <!-- Next.js App -->
    <g id="node-nextjs-web">
      <rect x="48" y="230" width="240" height="292" rx="10" fill="#162238" stroke="#388bfd" stroke-width="1.5" />
      <text x="64" y="256" fill="#f0f6fc" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700">Next.js 16 Web (`apps/web`)</text>
      <text x="64" y="274" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="11">FEL_EVIDENCE_SOURCE=fixture|http</text>

      <rect x="62" y="288" width="212" height="44" rx="6" fill="#1f2f4d" stroke="#30476e" />
      <text x="74" y="307" fill="#e6edf3" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="600">Evidence Reader (`/reader/[id]`)</text>
      <text x="74" y="323" fill="#8b949e" font-family="Inter, -apple-system, sans-serif" font-size="11">Global offsets, SHA-256 span checks</text>

      <rect x="62" y="340" width="212" height="44" rx="6" fill="#1f2f4d" stroke="#30476e" />
      <text x="74" y="359" fill="#e6edf3" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="600">Search Observatory (`/observatory`)</text>
      <text x="74" y="375" fill="#8b949e" font-family="Inter, -apple-system, sans-serif" font-size="11">4-lane RRF trace, replay &amp; run diff</text>

      <rect x="62" y="392" width="212" height="44" rx="6" fill="#1f2f4d" stroke="#30476e" />
      <text x="74" y="411" fill="#e6edf3" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="600">Earnings Update Desk (`/desk`)</text>
      <text x="74" y="427" fill="#8b949e" font-family="Inter, -apple-system, sans-serif" font-size="11">Conflict resolution &amp; 3D model view</text>

      <rect x="62" y="444" width="212" height="62" rx="6" fill="#1f2f4d" stroke="#30476e" />
      <text x="74" y="463" fill="#e6edf3" font-family="Inter, -apple-system, sans-serif" font-size="12.5" font-weight="600">Extraction Review (`/extractions`)</text>
      <text x="74" y="479" fill="#8b949e" font-family="Inter, -apple-system, sans-serif" font-size="11">Atomic batch accept/edit/merge,</text>
      <text x="74" y="494" fill="#8b949e" font-family="Inter, -apple-system, sans-serif" font-size="11">ETag conflict guards &amp; receipts</text>
    </g>

    <!-- Contracts Badge -->
    <g id="node-contracts-shared">
      <rect x="48" y="540" width="240" height="64" rx="8" fill="#1a243b" stroke="#6e7681" stroke-width="1.2" />
      <text x="64" y="564" fill="#d2a8ff" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="700">`packages/contracts` (0.9.0)</text>
      <text x="64" y="582" fill="#8b949e" font-family="Inter, -apple-system, sans-serif" font-size="11">Frozen OpenAPI + JSON Schemas</text>
      <text x="64" y="596" fill="#8b949e" font-family="Inter, -apple-system, sans-serif" font-size="11">AJV runtime guards + TS codegen</text>
    </g>
  </g>

  <!-- Zone 2: Service & Async Compute Layer -->
  <g id="zone-service-compute">
    <rect x="336" y="88" width="460" height="536" rx="12" fill="#131d31" stroke="#2ea043" stroke-width="1.5" stroke-dasharray="6 4" />
    <text x="352" y="114" fill="#56d364" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="0.08em">2. SERVICE &amp; ASYNC EXECUTION LAYER (PYTHON 3.11)</text>

    <!-- FastAPI Service -->
    <g id="node-fastapi">
      <rect x="356" y="132" width="420" height="174" rx="10" fill="#162436" stroke="#3fb950" stroke-width="1.5" />
      <text x="374" y="158" fill="#f0f6fc" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700">FastAPI Service (`apps/api`)</text>
      <text x="615" y="158" fill="#56d364" font-family="'JetBrains Mono', monospace" font-size="11">SET LOCAL ROLE fel_app</text>

      <rect x="372" y="172" width="186" height="54" rx="6" fill="#1c2d42" stroke="#2d4563" />
      <text x="384" y="191" fill="#e6edf3" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600">Auth &amp; Tenant Boundary</text>
      <text x="384" y="207" fill="#8b949e" font-family="Inter, -apple-system, sans-serif" font-size="10.5">Supabase JWKS / Mock verifier</text>
      <text x="384" y="220" fill="#8b949e" font-family="Inter, -apple-system, sans-serif" font-size="10.5">DB membership is authoritative</text>

      <rect x="572" y="172" width="188" height="54" rx="6" fill="#1c2d42" stroke="#2d4563" />
      <text x="584" y="191" fill="#e6edf3" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600">Composite Reader API</text>
      <text x="584" y="207" fill="#8b949e" font-family="Inter, -apple-system, sans-serif" font-size="10.5">Repeatable-read snapshot</text>
      <text x="584" y="220" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="10">published_at &lt;= effective_as_of</text>

      <rect x="372" y="236" width="186" height="54" rx="6" fill="#1c2d42" stroke="#2d4563" />
      <text x="384" y="255" fill="#e6edf3" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600">Retrieval &amp; Claims API</text>
      <text x="384" y="271" fill="#8b949e" font-family="Inter, -apple-system, sans-serif" font-size="10.5">Query plan, RRF k=60, replay</text>
      <text x="384" y="284" fill="#8b949e" font-family="Inter, -apple-system, sans-serif" font-size="10.5">Per-org budgets &amp; rate limits</text>

      <rect x="572" y="236" width="188" height="54" rx="6" fill="#1c2d42" stroke="#2d4563" />
      <text x="584" y="255" fill="#e6edf3" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600">Extraction Review API</text>
      <text x="584" y="271" fill="#8b949e" font-family="Inter, -apple-system, sans-serif" font-size="10.5">Batched atomic review (37 SQL)</text>
      <text x="584" y="284" fill="#8b949e" font-family="Inter, -apple-system, sans-serif" font-size="10.5">Live SSE event stream &amp; ETag</text>
    </g>

    <!-- Domain Packages Row -->
    <g id="node-domain-packages">
      <rect x="356" y="324" width="420" height="114" rx="10" fill="#192338" stroke="#a371f7" stroke-width="1.5" />
      <text x="374" y="348" fill="#d2a8ff" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="700">First-Party Domain Packages (`packages/*`)</text>

      <rect x="370" y="360" width="126" height="64" rx="6" fill="#212d47" stroke="#3b4d71" />
      <text x="380" y="379" fill="#f0f6fc" font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="700">`retrieval`</text>
      <text x="380" y="395" fill="#8b949e" font-family="Inter, -apple-system, sans-serif" font-size="10">4 lanes, RRF k=60,</text>
      <text x="380" y="409" fill="#8b949e" font-family="Inter, -apple-system, sans-serif" font-size="10">claim entailment</text>

      <rect x="503" y="360" width="126" height="64" rx="6" fill="#212d47" stroke="#3b4d71" />
      <text x="513" y="379" fill="#f0f6fc" font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="700">`ontology`</text>
      <text x="513" y="395" fill="#8b949e" font-family="Inter, -apple-system, sans-serif" font-size="10">saas-metrics/v1</text>
      <text x="513" y="409" fill="#8b949e" font-family="Inter, -apple-system, sans-serif" font-size="10">9 families, 14 KPIs</text>

      <rect x="636" y="360" width="126" height="64" rx="6" fill="#212d47" stroke="#3b4d71" />
      <text x="646" y="379" fill="#f0f6fc" font-family="Inter, -apple-system, sans-serif" font-size="11.5" font-weight="700">`calc-engine`</text>
      <text x="646" y="395" fill="#8b949e" font-family="Inter, -apple-system, sans-serif" font-size="10">34-digit Decimal DAG</text>
      <text x="646" y="409" fill="#8b949e" font-family="Inter, -apple-system, sans-serif" font-size="10">Jacobi SCC + ASTs</text>
    </g>

    <!-- Durable Python Workers -->
    <g id="node-workers">
      <rect x="356" y="456" width="420" height="148" rx="10" fill="#1a2436" stroke="#d29922" stroke-width="1.5" />
      <text x="374" y="482" fill="#f0f6fc" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700">Durable Python Workers (`workers/src/fel_workers`)</text>
      <text x="374" y="500" fill="#e3b341" font-family="'JetBrains Mono', monospace" font-size="11">FOR UPDATE SKIP LOCKED + Lease Heartbeat + Role fel_worker</text>

      <rect x="372" y="512" width="186" height="76" rx="6" fill="#242f42" stroke="#4d3d1b" />
      <text x="384" y="531" fill="#e6edf3" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600">SEC Ingestion Consumer</text>
      <text x="384" y="547" fill="#8b949e" font-family="Inter, -apple-system, sans-serif" font-size="10.5">EDGAR discovery, filing fetch,</text>
      <text x="384" y="561" fill="#8b949e" font-family="Inter, -apple-system, sans-serif" font-size="10.5">XBRL company-facts, SHA-256</text>
      <text x="384" y="575" fill="#8b949e" font-family="Inter, -apple-system, sans-serif" font-size="10.5">section/span extraction</text>

      <rect x="572" y="512" width="188" height="76" rx="6" fill="#242f42" stroke="#4d3d1b" />
      <text x="584" y="531" fill="#e6edf3" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600">Extraction Runtime FSM</text>
      <text x="584" y="547" fill="#8b949e" font-family="Inter, -apple-system, sans-serif" font-size="10.5">5 typed roles, 10-stage FSM,</text>
      <text x="584" y="561" fill="#8b949e" font-family="Inter, -apple-system, sans-serif" font-size="10.5">Decimal normalizer, accounting</text>
      <text x="584" y="575" fill="#8b949e" font-family="Inter, -apple-system, sans-serif" font-size="10.5">validators &amp; hard budget caps</text>
    </g>
  </g>

  <!-- Zone 3: Data & External Providers -->
  <g id="zone-storage-external">
    <rect x="824" y="88" width="308" height="536" rx="12" fill="#131d31" stroke="#8957e5" stroke-width="1.5" stroke-dasharray="6 4" />
    <text x="840" y="114" fill="#d2a8ff" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="0.08em">3. STORAGE &amp; EXTERNAL PROVIDERS</text>

    <!-- PostgreSQL -->
    <g id="node-postgres">
      <rect x="844" y="132" width="268" height="174" rx="10" fill="#182238" stroke="#58a6ff" stroke-width="1.5" />
      <text x="860" y="158" fill="#f0f6fc" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700">PostgreSQL 17 + pgvector</text>
      <text x="860" y="176" fill="#79c0ff" font-family="'JetBrains Mono', monospace" font-size="11">Append-only migrations 0001..0011</text>
      <text x="860" y="198" fill="#c9d1d9" font-family="Inter, -apple-system, sans-serif" font-size="11.5">&#8226; Shared read-only evidence corpus</text>
      <text x="860" y="216" fill="#c9d1d9" font-family="Inter, -apple-system, sans-serif" font-size="11.5">&#8226; Tenant-RLS workspaces &amp; runs</text>
      <text x="860" y="234" fill="#c9d1d9" font-family="Inter, -apple-system, sans-serif" font-size="11.5">&#8226; 512-dim HNSW + exact vector index</text>
      <text x="860" y="252" fill="#c9d1d9" font-family="Inter, -apple-system, sans-serif" font-size="11.5">&#8226; Durable job queue &amp; checkpoints</text>
      <text x="860" y="270" fill="#c9d1d9" font-family="Inter, -apple-system, sans-serif" font-size="11.5">&#8226; Atomic review &amp; conflict ledger</text>
      <text x="860" y="288" fill="#c9d1d9" font-family="Inter, -apple-system, sans-serif" font-size="11.5">&#8226; Usage metering &amp; audit events</text>
    </g>

    <!-- Object Storage -->
    <g id="node-object-storage">
      <rect x="844" y="324" width="268" height="104" rx="10" fill="#182238" stroke="#3fb950" stroke-width="1.5" />
      <text x="860" y="350" fill="#f0f6fc" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700">Canonical Object Store</text>
      <text x="860" y="368" fill="#56d364" font-family="'JetBrains Mono', monospace" font-size="11">Content-Addressed (`FEL_STORAGE_DIR`)</text>
      <text x="860" y="388" fill="#c9d1d9" font-family="Inter, -apple-system, sans-serif" font-size="11.5">&#8226; Immutable filing bodies &amp; HTML/text</text>
      <text x="860" y="406" fill="#c9d1d9" font-family="Inter, -apple-system, sans-serif" font-size="11.5">&#8226; Shared between API &amp; Worker</text>
    </g>

    <!-- External Providers -->
    <g id="node-providers">
      <rect x="844" y="446" width="268" height="158" rx="10" fill="#182238" stroke="#d29922" stroke-width="1.5" />
      <text x="860" y="472" fill="#f0f6fc" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700">External Providers</text>
      <text x="860" y="490" fill="#e3b341" font-family="'JetBrains Mono', monospace" font-size="11">packages/providers (`fel_providers`)</text>
      <text x="860" y="512" fill="#c9d1d9" font-family="Inter, -apple-system, sans-serif" font-size="11.5">&#8226; SEC EDGAR (rate-limited + fair access)</text>
      <text x="860" y="530" fill="#c9d1d9" font-family="Inter, -apple-system, sans-serif" font-size="11.5">&#8226; OpenAI Structured Output &amp; 512d Embed</text>
      <text x="860" y="548" fill="#c9d1d9" font-family="Inter, -apple-system, sans-serif" font-size="11.5">&#8226; Offline BYOK Credential Cipher</text>
      <text x="860" y="566" fill="#c9d1d9" font-family="Inter, -apple-system, sans-serif" font-size="11.5">&#8226; Deterministic Mocks (CI default)</text>
      <text x="860" y="584" fill="#8b949e" font-family="Inter, -apple-system, sans-serif" font-size="11">&#8226; FRED / Market adapters (staged)</text>
    </g>
  </g>

  <!-- Connectors -->
  <g id="layer-connectors" fill="none" stroke-width="2">
    <path d="M 168 200 L 168 226" stroke="#58a6ff" marker-end="url(#arrow-blue)" />
    <path d="M 288 260 L 352 215" stroke="#58a6ff" marker-end="url(#arrow-blue)" />
    <rect x="292" y="218" width="56" height="18" rx="4" fill="#0b1220" stroke="#2f4b7c" stroke-width="1" />
    <text x="298" y="230" fill="#79c0ff" font-family="'JetBrains Mono', monospace" font-size="9.5">Bearer</text>

    <path d="M 566 306 L 566 320" stroke="#bc8cff" marker-end="url(#arrow-purple)" />
    <path d="M 566 456 L 566 442" stroke="#bc8cff" marker-end="url(#arrow-purple)" />

    <path d="M 776 200 L 840 200" stroke="#3fb950" marker-end="url(#arrow-emerald)" />
    <path d="M 776 268 L 840 356" stroke="#3fb950" marker-end="url(#arrow-emerald)" />

    <path d="M 776 490 L 840 265" stroke="#d29922" marker-end="url(#arrow-amber)" />
    <path d="M 776 520 L 840 392" stroke="#d29922" marker-end="url(#arrow-amber)" />
    <path d="M 776 550 L 840 530" stroke="#d29922" marker-end="url(#arrow-amber)" />
  </g>
</svg>
