[project]
name = "fel-api"
version = "0.0.0"
description = "Financial Evidence Lab API (FastAPI modular monolith)"
requires-python = ">=3.11"
# Floors track requirements-dev.txt, which pip-audit gates in CI.
dependencies = [
  "fastapi>=0.121.0",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9.2",
  # The pool extra is load-bearing, not incidental: app/db.py serves every
  # request from a psycopg_pool.ConnectionPool (#191).
  "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
# Test-only. PyYAML parses the frozen contract in tests/test_openapi_parity.py.
dev = [
  "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
