name: Dependency advisories

# Weekly refresh (#143): catches a newly published advisory against an
# unchanged lockfile, which PR-triggered CI does not re-check. Runs the same
# two advisory gates as `make ci`'s security section (docs/development/testing.md).

on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

jobs:
  advisories:
    name: Advisory scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: JS advisory scan
        id: js_audit
        run: |
          pnpm install --frozen-lockfile
          node scripts/audit-bulk.mjs

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Python advisory scan
        id: py_audit
        run: |
          pip install -r requirements-dev.txt
          pip-audit -r requirements.txt -r requirements-dev.txt

      - name: Open or update tracking issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10);
            const title = `Dependency advisories: ${date}`;
            const label = "advisory";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The scheduled dependency-advisory refresh failed.`,
              ``,
              `- Workflow run: ${runUrl}`,
              `- JS advisory scan (\`node scripts/audit-bulk.mjs\`): ${{ steps.js_audit.outcome }}`,
              `- Python advisory scan (\`pip-audit\`): ${{ steps.py_audit.outcome }}`,
              ``,
              `See docs/development/testing.md for how to reproduce locally.`,
            ].join("\n");

            const existing = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open label:${label}`,
            });

            if (existing.data.items.length > 0) {
              const issue = existing.data.items[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
            }
