name: CI

on:
  push:
    branches: [main, "integration/**"]
  pull_request:
    branches: [main, "integration/**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  javascript:
    name: JS/TS — format, lint, typecheck, test, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: node scripts/audit-bulk.mjs

  web-e2e:
    name: Web — Playwright E2E (fixture mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Browser binaries are keyed on the resolved @playwright/test version, so
      # the cache is invalidated exactly when the browser build would change.
      - name: Resolve the Playwright version
        id: playwright
        run: |
          version="$(node -p "require('./apps/web/package.json').devDependencies['@playwright/test']")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Only chromium is configured in apps/web/playwright.config.ts. The
      # config's webServer block runs `next build && next start` and drives the
      # Observatory against fixture data (FEL_EVIDENCE_SOURCE=fixture) — no
      # live backend, no network.
      - name: Install Chromium (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @fel/web exec playwright install --with-deps chromium
      # System libraries live outside the cached browser directory, so they are
      # installed on a cache hit too — this is a no-op download-wise.
      - name: Install Chromium system dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @fel/web exec playwright install-deps chromium
      - run: pnpm --filter @fel/web run test:e2e

  python:
    name: Python — format, lint, typecheck, test, security
    runs-on: ubuntu-latest
    # Postgres service so the RLS tenant-isolation, workspace, cost, and
    # queue suites (TEST_DATABASE_URL-gated) always run in CI.
    services:
      postgres:
        # pgvector required by db/migrations/0003_retrieval_core.sql (halfvec + HNSW).
        image: pgvector/pgvector:0.8.5-pg17
        env:
          POSTGRES_USER: fel
          POSTGRES_PASSWORD: fel-ci-only
          POSTGRES_DB: fel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fel -d fel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://fel:fel-ci-only@localhost:5432/fel_test
      # Turn a silently-skipped DB suite into a failure: the Postgres service
      # above exists precisely so nothing here skips for want of a database.
      FEL_REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Apply migrations
        run: python scripts/db/migrate.py --database-url "$TEST_DATABASE_URL"
      - name: Verify the migration ledger is current
        run: python scripts/db/migrate.py --database-url "$TEST_DATABASE_URL" --check
      - run: black --check apps workers evals packages/providers packages/retrieval packages/retrieval-evals packages/ontology scripts conftest.py
      - run: ruff check apps workers evals packages/providers packages/retrieval packages/retrieval-evals packages/ontology scripts conftest.py
      - run: mypy apps/api/app workers/src evals/graders packages/providers/fel_providers packages/retrieval/fel_retrieval packages/retrieval-evals/fel_retrieval_evals packages/ontology/fel_ontology
      # --cov here (not in addopts) keeps local runs fast; the floor lives in
      # pyproject.toml's [tool.coverage.report].
      - run: pytest --cov --cov-report=term
      - run: bandit -q -r apps workers evals packages/providers packages/retrieval packages/retrieval-evals packages/ontology scripts -c pyproject.toml
      - run: pip-audit -r requirements.txt
      - run: pip-audit -r requirements-dev.txt

  database:
    name: DB — migration and backup-restore smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector required by db/migrations/0003_retrieval_core.sql (halfvec + HNSW).
        image: pgvector/pgvector:0.8.5-pg17
        env:
          POSTGRES_USER: fel
          POSTGRES_PASSWORD: fel-ci-only
          POSTGRES_DB: fel_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fel -d fel_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      # The applier runs from the runner (it needs psycopg, which the Postgres
      # image does not have); the smoke test still runs inside the service
      # container so pg_dump/pg_restore match the server version exactly — the
      # runner's postgresql-client lags pgvector/pgvector:0.8.5-pg17.
      - name: Apply migrations
        run: |
          pip install "psycopg[binary]>=3.2"
          python scripts/db/migrate.py \
            --database-url postgresql://fel:fel-ci-only@localhost:5432/fel_ci
      - name: Run backup-restore smoke test
        run: |
          docker cp infra/scripts/backup_restore_smoke.sh ${{ job.services.postgres.id }}:/tmp/smoke.sh
          docker cp db/migrations ${{ job.services.postgres.id }}:/tmp/migrations
          docker exec \
            -e PGHOST=localhost -e PGPORT=5432 -e PGUSER=fel \
            -e PGPASSWORD=fel-ci-only -e PGDATABASE=fel_ci \
            ${{ job.services.postgres.id }} bash /tmp/smoke.sh
      # Behavioral regression harnesses for migration guards (RLS, grant,
      # immutability, and idempotency rules): run every
      # db/migrations/tests/*.test.sql against the restored database — which
      # also proves the guards survive backup-restore. Each harness runs in
      # its own transaction and rolls back; a violated guard raises, failing
      # psql via ON_ERROR_STOP. The step fails when it finds no harness at all,
      # so a lost or mis-copied tests/ directory cannot pass as a silent no-op.
      # (The applier ignores tests/ — it never descends into subdirectories.)
      - name: Run migration regression harnesses
        run: |
          docker exec \
            -e PGHOST=localhost -e PGPORT=5432 -e PGUSER=fel \
            -e PGPASSWORD=fel-ci-only -e PGDATABASE=fel_ci \
            ${{ job.services.postgres.id }} bash -ec '
              shopt -s nullglob
              ran=0
              for f in /tmp/migrations/tests/*.test.sql; do
                echo "==> Running harness $(basename "$f")"
                psql --set ON_ERROR_STOP=1 --file "$f"
                ran=$((ran+1))
              done
              if [ "$ran" -eq 0 ]; then
                echo "FAIL: no migration harnesses found in /tmp/migrations/tests" >&2
                exit 1
              fi
              echo "OK: ${ran} migration harness(es) run"
            '
