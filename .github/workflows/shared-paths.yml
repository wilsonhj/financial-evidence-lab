# Enforces the shared-path table in AGENTS.md ("Shared paths"), which records
# the integration-lead ruling on #141. Every row of that table requires the
# `contract-change` label, so one check can enforce all four: if a PR touches a
# shared path without the label, fail.
#
# This deliberately does NOT try to decide whether an ADR was also required.
# That depends on the class of change and on an ADR's acceptance state, which
# is a judgement for the integration lead, not a glob match. The label is the
# mechanical part, and the label is what #140 and #128 were missing.
#
# Lives in its own workflow rather than in ci.yml so that a shared-path PR and
# a CI PR do not conflict in the same file.
name: Shared paths

on:
  pull_request:
    # `labeled`/`unlabeled` are required: without them, adding the missing
    # label does not re-run the check and the PR stays red.
    #
    # `edited` is required too: changing a PR's base branch fires only
    # `edited` and keeps the head SHA, so a result computed against the old
    # base stays green. A PR stacked on a branch with an unlabelled AGENTS.md
    # edit, then retargeted to main, would carry that edit in unchecked.
    # GitHub also retargets on its own when the old base is deleted after it
    # merges. Title and body edits re-run this ~4 s job too.
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read

jobs:
  contract-change-label:
    name: Shared-path changes carry contract-change
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the diff below starts at the merge-base, and finding
          # it needs every commit back to where the PR left the base branch.
          fetch-depth: 0

      - name: Test changed-path listing
        run: |
          bash .github/scripts/list-changed-paths.test.sh
          bash .github/scripts/contract-change-label.test.sh

      - name: Check the label against the changed paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail

          # A labeled event's pull_request.labels list can omit the label that
          # triggered the run. A unlabeled event's list can still include it.
          HAS_LABEL=$(bash .github/scripts/contract-change-label.sh "$EVENT_ACTION" "$EVENT_LABEL" "$PR_LABELS")

          # Kept in sync with AGENTS.md "Shared paths" by hand. A path is shared
          # if it matches any of these prefixes or is one of the named files.
          shared_prefix='^(\.github/|\.specify/|specs/|packages/contracts/|db/migrations/|docs/decisions/)'
          shared_exact='^(docs/handoff/workstreams\.yaml|docs/handoff/STATUS\.md|AGENTS\.md|package\.json|package-lock\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|pyproject\.toml|Makefile)$'

          # Diff from the merge-base, not from base.sha. base.sha is the base
          # branch's tip when the event fired, so once main moves past the
          # point where the PR left it, a two-dot diff reports main's own new
          # commits as this PR's changes (#352 failed this way on #348's files).
          #
          # A merge-base needs real history on both sides. A shallow clone, or
          # a `--depth` fetch that grafts away the base commit's parents, can
          # leave none, so refuse to run shallow and never fetch with --depth.
          #
          # Assign first: `set -e` does not see a command substitution inside
          # `[ ]`, so a failing rev-parse would compare "" and carry on.
          shallow=$(git rev-parse --is-shallow-repository)
          if [ "$shallow" = "true" ]; then
            echo "FAIL: the checkout is shallow, so the merge-base cannot be" >&2
            echo "trusted. Keep fetch-depth: 0 on actions/checkout." >&2
            exit 1
          fi
          # fetch-depth: 0 misses base.sha if its branch was force-pushed or deleted.
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BASE_SHA"
          fi
          if ! merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA"); then
            echo "FAIL: no merge-base between base $BASE_SHA and head $HEAD_SHA," >&2
            echo "so this PR's own changes cannot be isolated. Refusing to" >&2
            echo "report success." >&2
            exit 1
          fi
          changed=$(bash .github/scripts/list-changed-paths.sh "$merge_base" "$HEAD_SHA")

          if [ -z "$changed" ]; then
            echo "No changed files; nothing to check."
            exit 0
          fi

          # `|| true` would swallow grep's exit 2 (a bad pattern) as well as its
          # exit 1 (no match), leaving `touched` empty and passing the check
          # without having matched anything — the exact defect #199/#202 are
          # about. Tolerate 1, refuse anything higher.
          set +e
          touched=$(printf '%s\n' "$changed" | grep -E "$shared_prefix|$shared_exact")
          grep_rc=$?
          set -e
          if [ "$grep_rc" -gt 1 ]; then
            echo "FAIL: the shared-path matcher exited $grep_rc, so it never" >&2
            echo "decided anything. Refusing to report success." >&2
            exit 1
          fi

          if [ -z "$touched" ]; then
            echo "OK: this PR touches no shared path."
            exit 0
          fi

          echo "This PR touches these shared paths:"
          printf '%s\n' "$touched" | sed 's/^/  /'

          if [ "$HAS_LABEL" = "true" ]; then
            echo
            echo "OK: the contract-change label is present."
            exit 0
          fi

          echo
          echo "FAIL: shared paths changed without the 'contract-change' label." >&2
          echo "Every row of the shared-path table in AGENTS.md requires it." >&2
          echo "Add the label, and check whether your change also needs an accepted ADR." >&2
          exit 1
