  <title>Corpus QA documents by issuer: 2026-07-14-synthetic-cohort</title>
  <desc>Horizontal stacked bar chart for the synthetic run 2026-07-14-synthetic-cohort. One row per cohort issuer, in cohort order, on a shared axis of documents; each bar is segmented into documents_parsed, ingested-but-not-parsed, and documents_quarantined, and the absolute document count is printed at the end of the bar. The TOTAL row below the separator is the whole-cohort composition drawn on its own scale, not a magnitude comparable to the issuer rows. Single snapshot; no time series. A row label marked with an asterisk has span_hash_verification_rate 'unavailable'; its bar is drawn from document counts only.</desc>
